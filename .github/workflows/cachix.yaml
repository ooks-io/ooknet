name: Build Packages
on:
  push:
    paths: 
      - "outputs/pkgs/**"
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v25
    - uses: cachix/cachix-action@v14
      with:
        name: ooknet
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: Build packages
      run: | 
        nix build \
          .#ook-vim \
          .#live-buds-cli \
          .#caddy-with-cloudflare \
          .#fpp-config \
          .#fpp-launcher \
          .#fpp-sd \
          .#project-plus \
          .#repomix \
          .#website \
          .#wii-u-gc-adapter
