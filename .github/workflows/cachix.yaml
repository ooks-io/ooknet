name: "cache"
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v24
    - uses: cachix/cachix-action@v12
      with:
        name: ooknet
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: Build packages
      run: |
        nix build .#ook-vim \
                 .#live-buds-cli \
                 .#caddy-with-cloudflare \
                 .#fpp-config \
                 .#fpp-launcher \
                 .#fpp-sd \
                 .#project-plus \
                 .#repomix \
                 .#website \
                 .#wii-u-gc-adapter
