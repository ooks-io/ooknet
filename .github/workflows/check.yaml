name: "Nix Flake Check"
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - .github/**
      - README.md
      - .repomixignore
      - repomix.config.json
      - .gitignore
concurrency:
  group: ooknet-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix run nixpkgs#alejandra -- --check .

  check-dead-code:
    name: Check Dead Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # check only. deadnix-action runs --edit and opens a pr, which needs
      # write access and strips comments like the #css hint in ooksfox.nix
      - run: nix run nixpkgs#deadnix -- --fail .
  # no flake check here, local git+file inputs and private repos cant be
  # fetched from gh runners. eval happens locally, local ci planned

